name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm exec prettier --check .

  typecheck-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test

  build-web:
    runs-on: ubuntu-latest
    needs: [lint-web, typecheck-web, test-web]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  typecheck-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp -DskipTests compile

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      RUN_TESTCONTAINERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp test

  e2e:
    runs-on: ubuntu-latest
    needs: [build-web, test-api]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start docker-compose stack
        run: docker compose up -d --wait --build
        working-directory: ${{ github.workspace }}

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              echo "api up"; exit 0
            fi
            sleep 2
          done
          echo "api did not start in time" >&2
          docker compose logs api
          exit 1
        working-directory: ${{ github.workspace }}

      - name: Install web deps and Playwright
        run: |
          pnpm install --frozen-lockfile=false
          pnpm exec playwright install --with-deps

      - name: Seed events
        run: bash scripts/seed-events.sh
        working-directory: ${{ github.workspace }}

      - name: Run Playwright
        run: pnpm exec playwright test --reporter=list
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color
        working-directory: ${{ github.workspace }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-web, test-api]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          tags: livevents-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          tags: livevents-web:ci
