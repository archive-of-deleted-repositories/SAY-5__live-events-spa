spring:
  datasource:
    url: jdbc:h2:mem:livevents;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: PLAINTEXT://localhost:0
    consumer:
      auto-offset-reset: earliest

livevents:
  kafka:
    topic: events.live
  sse:
    history-on-connect: 10
    backpressure-buffer: 64
